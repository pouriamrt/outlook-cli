[project]
name = "outlook-cli"
version = "0.1.0"
description = "Command-line client for Microsoft 365 mail and calendar"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pouria Mortezaagha", email = "pouriamortezaagha7@gmail.com" }]
keywords = ["outlook", "microsoft-365", "graph-api", "cli", "email", "calendar"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "filelock>=3.14.0",
    "dateparser>=1.2.0",
    "tzlocal>=5.2",
    "html2text>=2024.2.26",
    "tomli-w>=1.0.0",
    "truststore>=0.10.4",
    "certifi>=2026.5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-vcr>=1.0.2",
    "respx>=0.21.0",
    "syrupy>=4.6.0",
    "hypothesis>=6.100.0",
    "freezegun>=1.5.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/pouriamrt/outlook-cli"
Repository = "https://github.com/pouriamrt/outlook-cli"
Issues = "https://github.com/pouriamrt/outlook-cli/issues"

[project.scripts]
outlook = "outlook_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM"]
ignore = ["N818"]  # Exception names like SessionExpired/NotFound don't need an Error suffix

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: end-to-end tests against real Graph (gated by OUTLOOK_CLI_E2E)",
]

[tool.coverage.run]
source = ["src/outlook_cli"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
